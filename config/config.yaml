mt5:
  enabled: true
  login: 114202389
  password: ''
  server: HFMarketsGlobal-Live7
  path: ''
  magic_number: 777777
  default_lot: 0.01
  high_confidence_lot: 0.05
  us_session_aggressive_lot: 0.08   # Khusus Sesi US (19:00 - 24:00 WIB) akun USC: 0.08 Lot untuk momen bagus/agresif
  high_confidence_threshold: 80.0
  cent_only_high_grade: true        # Akun Cent (USC) HANYA masuk sinyal Grade A+ (0.05 Lot). Sinyal standar (< 80%) di-skip demi akurasi sniper
  enable_limit_orders: true         # Mengaktifkan Pending Limit Order (Buy Limit & Sell Limit) anti-kejar lilin Bob Volman
  limit_order_expiry_mins: 120      # Masa berlaku pending order: 120 menit (2 jam / 8 candle M15). Auto-cancel jika tidak tersentuh
  limit_order_lot: 0.05             # Ukuran lot khusus pending limit order Grade A+ (0.05 Lot)
  max_pending_orders_per_symbol: 1  # Maksimal 1 pending order aktif per simbol untuk mencegah penumpukan
  min_limit_distance_pips: 15.0     # Jarak minimal harga limit dari harga pasar saat ini: 15 pips ($1.50 USD)
  risk_percent: 1.0
  max_slippage: 20
  gold_symbol: XAUUSDc
  trading_hours: all
  max_positions_usd: 1              # Akun USD Standard: Maksimal 1 posisi (disiplin margin)
  max_positions_cent: 3             # Akun Cent (USC): Maksimal 3 posisi (bisa nambah/layering saat ada sinyal bagus)
  us_session_max_positions: 3       # Sesi US Akun Cent (USC): Maksimal 3 posisi
  min_grid_spacing: 1.0             # Jarak minimal antar posisi $1.00 USD (10 pips) agar tidak staking di titik yang sama
  use_trailing_stop: false          # Dinonaktifkan: fokus pengawalan target TP/SL & Auto-BEP
  enable_break_even: true           # Auto Break-Even (BEP) saat floating profit mencapai target
  break_even_quick_pips: 45.0       # Sinyal Cepat: Otomatis BEP saat floating profit +45 pips ($4.50 USD / 75% ke target TP 60 pips)
  break_even_long_pips: 100.0       # Sinyal Long / TP Jauh: Otomatis BEP saat floating profit +100 pips ($10.00 USD)
  break_even_buffer_pips: 15.0      # Buffer pengaman di atas entry: +15 pips ($1.50 USD = 15 USC) mengunci untung riil jika kena pullback
  enable_reversal_auto_close: true  # Mengizinkan cut loss / auto-close dini jika terkonfirmasi pembalikan tren 90% - 100% 9 Buku PDF
  reversal_auto_close_min_score: 92.0  # Batas minimal skor pembalikan untuk cut loss dini (92% - 100%)
  enable_reversal_flip: true        # Mengizinkan pembalikan posisi (Cut loss posisi lama & langsung masuk posisi sebaliknya) jika skor >= 92%
  min_reversal_flip_score: 92.0     # Minimal skor 92% untuk flip posisi sebaliknya sesuai 9 Buku PDF
  enable_fast_reversal_guard: false # Dinonaktifkan: Mencegah cut loss dini 22 pips yang mencambuk modal (biarkan posisi bernapas ke TP/SL 60 pips)
  fast_reversal_pips_threshold: 45.0 # Ambang batas pips jika fast reversal diaktifkan
  enable_judas_swing_filter: true   # Filter anti-manipulasi likuiditas Sesi London (12:00 - 16:00 WIB / jam 4 sore)
  london_h1_confirmation: true      # Khusus Sesi London: Open posisi wajib konfirmasi searah tren & candle H1 (1-Hour)
  london_h1_max_hour: 16            # Maksimal jam 16:00 WIB (setelah jam 4 sore manipulasi reda, kembali ke M15 biasa)
  # Target Take Profit & Stop Loss Gold XAUUSD
  # HARD CONSTRAINT PENGGUNA: SL & TP MINIMAL 60 PIPS ($6.00 USD) 1:1 DILARANG DI BAWAH ITU!
  gold_short_tp_pips: 60.0          # Target TP cepat mode sideways/normal: Minimal 60 pips ($6.00 USD) - R:R 1:1
  gold_short_sl_pips: 60.0          # Stop Loss sinyal cepat: Minimal 60 pips ($6.00 USD) - R:R minimal 1:1
  gold_long_tp_pips: 180.0          # Target TP jauh saat tren momentum kuat: 180 pips ($18.00 USD) - Rasio 3:1 (TP 3, SL 1)
  gold_long_sl_pips: 60.0           # Stop Loss tren jauh: 60 pips ($6.00 USD) - Rasio mutlak 3:1
  min_gold_sl_pips: 60.0            # Batas lantai mutlak SL Gold: 60 pips (6.00 USD)
  min_gold_tp_pips: 60.0            # Batas lantai mutlak TP Gold: 60 pips (6.00 USD)
  min_risk_reward_ratio: 1.0        # Rasio R:R mutlak minimal 1:1 (Dilarang keras TP 1 SL 2!)
  long_risk_reward_ratio: 3.0       # Rasio R:R sinyal TP jauh: wajib 3:1 (TP 3, SL 1)
  # ─── ARSITEKTUR 3 LAPIS (Otak Utama H4, 9 Modul Pemicu Dual Jalur A/B, Risk Guard) ───
  enable_3layer_architecture: true  # Mengaktifkan evaluasi 3 lapis komprehensif
  min_layer_modules_agree: 3        # Minimal 3 modul setuju untuk Jalur A (Konfluensi)
  solo_sniper_min_score: 80.0       # Skor minimal 80% (Grade A+) untuk eksekusi mandiri Jalur B (Solo Sniper)
  # ─── METODE RETEST TERKONFIRMASI 9 BUKU (Best Price Entry) ──────────────────
  enable_retest_entry: true         # Prioritas entry retest: BUY di bawah (Diskon), SELL di atas (Premium)
  retest_tolerance_pct: 0.35        # Toleransi sentuhan area retest (0.35%)
  retest_min_rejection_wick: 0.25   # Minimal ekor penolakan (25% dari range candle)
  require_9books_retest_confirm: true # Wajib ada konfirmasi rejection + momentum/volume 9 buku
  max_spread_usd: 0.65              # Maksimal spread $0.65 USD (65 pips) agar tidak entry saat spread malam melebar
  enable_rollover_guard: true       # Menahan entry saat jam rollover malam broker (04:45 - 05:20 WIB)
  max_consecutive_losses: 2         # Jika 2x SL beruntun, aktifkan cooldown pengamanan 45 menit
  consecutive_loss_cooldown_mins: 45
  # ─── FILTER ANTI-PUCUK & ANTI-DASAR JURANG (Martin Pring + Bob Volman) ───────
  rsi_overbought_block: 68.0        # HARAM BUY jika RSI >= 68 (beli di pucuk = kena distribution)
  rsi_oversold_block: 32.0          # HARAM SELL jika RSI <= 32 (jual di dasar = kena accumulation bounce)
  max_ema_distance_atr_mult: 1.5    # Harga boleh entry MAX 1.5x ATR dari EMA20 (anti-kejar lilin Bob Volman)
  directional_cooldown_mins: 35     # Setelah SL BUY, lock BUY 35 menit; setelah SL SELL, lock SELL 35 menit
  enable_midnight_rest: true        # Jendela istirahat & reset bot pukul 02:00 - 04:00 WIB (stop trading)
  midnight_rest_start_hour: 2       # 02:00 WIB: Stop trading / istirahat
  midnight_rest_end_hour: 4         # 04:00 WIB: Reset state, siap buka posisi lagi saat pasar pagi aktif (05:00 WIB)
  min_confluence_score: 65.0        # Batas minimal skor akurasi 9 Buku PDF untuk eksekusi MT5 (Grade A >= 65%)
  usd_only_high_grade: true         # Akun USD Standard HANYA masuk sinyal Grade A+ (0.05 lot bagus). Sinyal standar/0.01 dilewati.
  cent_only_high_grade: true        # Akun Cent USC HANYA masuk sinyal Grade A+ (0.05 lot sniper). Sinyal standar (< 80%) dilewati.
  usd_execution_lot: 0.01           # Ukuran lot khusus akun USD Standard pada sinyal Grade A+: mutlak 0.01 Lot
  # Batas kerugian harian USC dihilangkan di jam normal karena dipantau langsung oleh user
  max_daily_loss_usd: 50.0          # Batas maksimal kerugian harian akun USD Standard (-$50 USD) 24/7
