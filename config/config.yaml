# ==========================================
# KONFIGURASI BOT SINYAL TRADING SAHAM (IDX)
# ==========================================

# Daftar saham berpotensi cuan tertinggi di Indonesia (Likuiditas & Volatilitas Terbaik)
watchlist:
  # 1. Perbankan & Bluechips Utama (Likuiditas Tinggi & Penggerak IHSG)
  - BBCA.JK
  - BBRI.JK
  - BMRI.JK
  - BBNI.JK
  - BRIS.JK
  - ASII.JK
  - TLKM.JK

  # 2. Komoditas Energi & Tambang (Volatilitas Lebar, Favorit Trader)
  - ADRO.JK
  - MEDC.JK
  - PTBA.JK
  - AKRA.JK
  - PGAS.JK

  # 3. Emas, Nikel & Mineral (Momentum Cuan Harian Tinggi)
  - ANTM.JK
  - MDKA.JK
  - INCO.JK
  - TINS.JK
  - BRMS.JK

  # 4. Konglomerasi & High-Beta (Pergerakan Harian Paling Cepat di IDX)
  - BREN.JK
  - BRPT.JK
  - AMMN.JK
  - CUAN.JK

  # 5. Konsumer & Retail Aktif
  - ICBP.JK
  - AMRT.JK
  - MYOR.JK
  - ACES.JK

  # 6. Teknologi & Finansial Digital
  - GOTO.JK
  - ARTO.JK

  # 7. Komoditas Emas Dunia (XAU/USD - Aktif 24 Jam)
  - XAUUSD

# Pengaturan Pengambilan Data
data:
  default_interval: "1d"         # 1d (harian), 15m, 30m, 1h
  default_period: "2y"           # 1mo, 3mo, 6mo, 1y, 2y, 5y, max
  intraday_interval: "15m"       # untuk pemantauan live day trading
  intraday_period: "60d"         # batas maksimal yfinance untuk intraday 15m
  retry_attempts: 3
  retry_backoff_factor: 2.0      # Exponential backoff (detik)
  timeout_seconds: 15

# Pengaturan Trading Harian & Manajemen Risiko (Risk Management)
trading:
  # Mode: 'intraday' (trading cepat dalam hari) atau 'daily' (swing harian)
  mode: "intraday"               
  intraday:
    interval: "15m"
    take_profit_pct: 2.5         # Target Profit 2.5% per trade
    stop_loss_pct: 1.5           # Stop Loss ketat 1.5%
    trailing_stop_pct: 1.0       # Trailing Stop 1.0% jika sudah profit
  daily:
    interval: "1d"
    take_profit_pct: 5.0         # Target Profit 5.0%
    stop_loss_pct: 3.0           # Stop Loss 3.0%
    trailing_stop_pct: 2.0

# Pengaturan Eksekutor MetaTrader 5 (MT5 Auto-Trade)
mt5:
  enabled: true                 # true untuk eksekusi order otomatis di MT5, false untuk mode sinyal saja
  login: 114202389               # Nomor akun MT5 HFM
  password: ""                   # Password trading MT5 (isi di sini atau biarkan terminal MT5 login)
  server: "HFMarketsGlobal-Live7" # Server broker MT5 (HFM / HotForex)
  path: ""                       # Path terminal64.exe jika kustom (biarkan kosong untuk auto-detect)
  magic_number: 777777           # ID unik penanda transaksi bot
  default_lot: 0.01              # Ukuran lot per transaksi (0.01 = micro lot)
  risk_percent: 1.0              # Batas risiko modal per trade (% dari Equity akun)
  max_slippage: 20               # Toleransi deviasi harga (dalam points)
  gold_symbol: "XAUUSDc"         # Simbol emas di broker ("XAUUSDc" untuk akun Cent HFM)

# Parameter Indikator Teknikal
indicators:
  moving_averages:
    periods: [20, 50, 200]
  rsi:
    period: 14
    oversold_threshold: 30
    overbought_threshold: 70
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9
  bollinger_bands:
    period: 20
    std_dev: 2.0
  volume:
    avg_period: 20
    surge_threshold: 1.5         # 1.5x rata-rata volume 20 periode

# Definisi Strategi Trading (Mendukung Day Trading & Swing Harian)
strategies:
  active: "Master_Confluence_Strategy"
  definitions:
    # 0. Strategi Konfluensi Master (Buku Bob Volman, Fibonacci, Ichimoku, Murphy, Mega Profit)
    Master_Confluence_Strategy:
      description: "Konfluensi Tertinggi: Trend EMA50 + Area Pantulan 20 EMA/Fibonacci + Rejection Wick + Volume"
      buy_rules:
        - indicator: "close"
          operator: ">="
          target: "ema_50"
          description: "Tren Mayor Bullish (Harga di Atas EMA 50)"
        - indicator: "rejection_wick_ratio"
          operator: ">="
          value: 0.35
          description: "Candle Rejection Wick (Buyer Membeli Kuat di Bawah)"
        - indicator: "volume_ratio"
          operator: ">="
          value: 1.1
          description: "Volume Konfirmasi Buyer (>= 1.1x Rata-rata)"
        - indicator: "rsi"
          operator: "<="
          value: 60.0
          description: "RSI Belum Overbought (RSI <= 60)"
      sell_rules:
        - indicator: "rsi"
          operator: ">"
          value: 72.0
          description: "RSI Overbought (> 72)"
        - indicator: "close"
          operator: "cross_under"
          target: "ema_20"
          description: "Harga Tembus ke Bawah EMA 20"

    # 1. Strategi Day Trading (Intraday 15m / 30m)
    DayTrading_Intraday_Momentum:
      description: "Strategi Day Trading Cepat Momentum Intraday (EMA 20 + RSI Momentum + Volume Breakout)"
      buy_rules:
        - indicator: "close"
          operator: ">"
          target: "ema_20"
          description: "Harga menembus / di atas EMA 20 (Tren Jangka Pendek Bullish)"
        - indicator: "rsi"
          operator: ">"
          value: 50.0
          description: "RSI > 50 (Momentum Pembelian Kuat)"
        - indicator: "rsi"
          operator: "<"
          value: 70.0
          description: "RSI < 70 (Belum Overbought / Ruang Kenaikan Cukup)"
        - indicator: "volume"
          operator: ">"
          target: "volume_sma_20"
          multiplier: 1.2
          description: "Volume Spike > 1.2x Rata-rata 20 Periode"
      sell_rules:
        - indicator: "close"
          operator: "cross_under"
          target: "ema_20"
          description: "Harga tembus ke bawah EMA 20 (Kehilangan Momentum)"
        - indicator: "rsi"
          operator: ">"
          value: 75.0
          description: "RSI Ekstrem Overbought (> 75) Area Ambil Keuntungan"

    # 2. Strategi Swing Trading Harian (Daily 1d)
    Daily_Swing_Pullback:
      description: "Strategi Swing Harian Membeli Saat Pullback di Atas EMA 50"
      buy_rules:
        - indicator: "close"
          operator: ">"
          target: "ema_50"
          description: "Harga di atas EMA 50 (Tren Menengah Bullish)"
        - indicator: "rsi"
          operator: "<"
          value: 45.0
          description: "RSI Pullback / Koreksi Sehat (< 45)"
        - indicator: "close"
          operator: ">"
          target: "ema_20"
          description: "Harga Rebound di atas EMA 20"
      sell_rules:
        - indicator: "close"
          operator: "cross_under"
          target: "ema_20"
          description: "Harga tembus ke bawah EMA 20"
        - indicator: "rsi"
          operator: ">"
          value: 70.0
          description: "RSI Overbought (> 70)"

    # 3. Strategi Default (Reversal & Volume)
    Default_RSI_EMA_Volume:
      description: "Strategi Sinyal Reversal Momentum & Volume"
      buy_rules:
        - indicator: "rsi"
          operator: "<"
          value: 30.0
          description: "RSI Oversold (< 30)"
        - indicator: "close"
          operator: ">"
          target: "ema_50"
          description: "Harga Close di atas EMA 50"
        - indicator: "volume"
          operator: ">"
          target: "volume_sma_20"
          multiplier: 1.5
          description: "Volume konfirmasi > 1.5x rata-rata 20 periode"
      sell_rules:
        - indicator: "rsi"
          operator: ">"
          value: 70.0
          description: "RSI Overbought (> 70)"
        - indicator: "close"
          operator: "cross_under"
          target: "ema_20"
          description: "Harga tembus ke bawah EMA 20"

# Pengaturan Jadwal Bursa Efek Indonesia (WIB - Asia/Jakarta)
scheduler:
  interval_minutes: 15
  timezone: "Asia/Jakarta"
  check_market_hours: true
  idx_market_hours:
    mon_thu:
      session_1: { start: "09:00", end: "11:30" }
      session_2: { start: "13:30", end: "15:50" }
    fri:
      session_1: { start: "09:00", end: "11:30" }
      session_2: { start: "14:00", end: "15:50" }

# Database SQLite & File Penyimpanan
storage:
  db_path: "data/stock_data.db"

# Pengaturan Logging
logging:
  level: "INFO"
  log_dir: "logs"
  retention_days: 14
