data:
  default_interval: 1d
  default_period: 2y
  intraday_interval: 15m
  intraday_period: 60d
  retry_attempts: 3
  retry_backoff_factor: 2.0
  timeout_seconds: 15
trading:
  mode: intraday
  intraday:
    interval: 15m
    take_profit_pct: 2.5
    stop_loss_pct: 1.5
    trailing_stop_pct: 1.0
  daily:
    interval: 1d
    take_profit_pct: 5.0
    stop_loss_pct: 3.0
    trailing_stop_pct: 2.0
mt5:
  enabled: true
  login: 114202389
  password: ''
  server: HFMarketsGlobal-Live7
  path: ''
  magic_number: 777777
  default_lot: 0.01
  high_confidence_lot: 0.05
  high_confidence_threshold: 80.0
  risk_percent: 1.0
  max_slippage: 20
  gold_symbol: XAUUSDc
  trading_hours: all
  max_positions_usd: 1
  max_positions_cent: 3  # Maksimal 3 posisi untuk akun Cent (USC) saat ada setup/momen konfluensi baru
  min_grid_spacing: 1.0  # Jarak minimal antar posisi $1.00 USD (10 pips) agar sinyal candle baru tidak terblokir
  use_trailing_stop: false  # Dinonaktifkan sesuai instruksi: murni target TP/SL sesuai mode pasar
  enable_break_even: true   # Auto Break-Even (BEP) saat floating profit mencapai target
  break_even_long_pips: 100.0  # Sinyal Long / TP Jauh: Otomatis BEP saat floating profit +100 pips ($10.00 USD)
  break_even_buffer_pips: 3.0  # Buffer pengaman di atas entry: +3 pips ($0.30 USD) agar transaksi bebas risiko & menutupi komisi
  enable_reversal_auto_close: true  # Mengizinkan cut loss / auto-close dini jika terkonfirmasi pembalikan tren 90% - 100% 9 Buku PDF
  reversal_auto_close_min_score: 90.0  # Batas minimal skor pembalikan untuk cut loss dini (90% - 100%)
  enable_reversal_flip: true  # Mengizinkan pembalikan posisi (Cut loss posisi lama & langsung masuk posisi sebaliknya) jika skor >= 90%
  min_reversal_flip_score: 90.0  # Minimal skor 90% untuk flip posisi sebaliknya sesuai 9 Buku PDF
  max_spread_usd: 0.65  # Maksimal spread $0.65 USD (65 pips) agar tidak entry saat spread malam melebar
  enable_rollover_guard: true  # Menahan entry saat jam rollover malam broker (04:45 - 05:20 WIB)
  max_consecutive_losses: 2  # Jika 2x SL beruntun, aktifkan cooldown pengamanan 60 menit
  consecutive_loss_cooldown_mins: 60
  enable_midnight_guard: true  # Proteksi tidur tengah malam (02:00 - 04:30 WIB) agar tidak boncos saat user istirahat
  midnight_start_hour: 2  # 02:00 WIB
  midnight_end_hour: 4    # 04:30 WIB (sebelum rollover 04:45 WIB)
  midnight_end_minute: 30
  midnight_max_loss_usc: 50.0  # Batas maksimal kerugian di jam tidur tengah malam akun Cent (-50 USC)
  min_confluence_score: 65.0  # Batas minimal skor akurasi 9 Buku PDF untuk eksekusi MT5 (Grade A)
  # Target Take Profit & Stop Loss Adaptif Sesuai Momen (Semua Jam: Pagi, London, US)
  gold_short_tp_pips: 60.0   # Sinyal short/scalping: 60 pips ($6.00 USD)
  gold_short_sl_pips: 60.0   # Stop loss sinyal short: 60 pips ($6.00 USD) - R:R 1:1
  gold_long_tp_pips: 140.0   # Target panjang saat momen tren panjang bagus: 140 pips ($14.00 USD)
  gold_long_sl_pips: 60.0    # Stop loss momen panjang dijaga 60 pips ($6.00 USD)
  # Batas kerugian harian USC dihilangkan di jam normal karena dipantau langsung oleh user
  max_daily_loss_usd: 50.0  # Batas maksimal kerugian harian akun USD Standard (-$50 USD) 24/7
indicators:
  moving_averages:
    periods:
    - 20
    - 50
    - 200
  rsi:
    period: 14
    oversold_threshold: 30
    overbought_threshold: 70
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9
  bollinger_bands:
    period: 20
    std_dev: 2.0
  volume:
    avg_period: 20
    surge_threshold: 1.5
strategies:
  active: Master_Confluence_Strategy
  definitions:
    Master_Confluence_Strategy:
      description: 'Konfluensi Tertinggi: Trend EMA50 + Area Pantulan 20 EMA/Fibonacci
        + Rejection Wick + Volume'
      buy_rules:
      - indicator: close
        operator: '>='
        target: ema_50
        description: Tren Mayor Bullish (Harga di Atas EMA 50)
      - indicator: volume_ratio
        operator: '>='
        value: 1.0
        description: Volume Konfirmasi Buyer (>= 1.0x Rata-rata)
      - indicator: rsi
        operator: <=
        value: 65.0
        description: RSI Belum Overbought (RSI <= 65)
      sell_rules:
      - indicator: rsi
        operator: '>'
        value: 72.0
        description: RSI Overbought (> 72)
      - indicator: close
        operator: cross_under
        target: ema_20
        description: Harga Tembus ke Bawah EMA 20
    DayTrading_Intraday_Momentum:
      description: Strategi Day Trading Cepat Momentum Intraday (EMA 20 + RSI Momentum
        + Volume Breakout)
      buy_rules:
      - indicator: close
        operator: '>'
        target: ema_20
        description: Harga menembus / di atas EMA 20 (Tren Jangka Pendek Bullish)
      - indicator: rsi
        operator: '>'
        value: 50.0
        description: RSI > 50 (Momentum Pembelian Kuat)
      - indicator: rsi
        operator: <
        value: 70.0
        description: RSI < 70 (Belum Overbought / Ruang Kenaikan Cukup)
      - indicator: volume
        operator: '>'
        target: volume_sma_20
        multiplier: 1.2
        description: Volume Spike > 1.2x Rata-rata 20 Periode
      sell_rules:
      - indicator: close
        operator: cross_under
        target: ema_20
        description: Harga tembus ke bawah EMA 20 (Kehilangan Momentum)
      - indicator: rsi
        operator: '>'
        value: 75.0
        description: RSI Ekstrem Overbought (> 75) Area Ambil Keuntungan
    Daily_Swing_Pullback:
      description: Strategi Swing Harian Membeli Saat Pullback di Atas EMA 50
      buy_rules:
      - indicator: close
        operator: '>'
        target: ema_50
        description: Harga di atas EMA 50 (Tren Menengah Bullish)
      - indicator: rsi
        operator: <
        value: 45.0
        description: RSI Pullback / Koreksi Sehat (< 45)
      - indicator: close
        operator: '>'
        target: ema_20
        description: Harga Rebound di atas EMA 20
      sell_rules:
      - indicator: close
        operator: cross_under
        target: ema_20
        description: Harga tembus ke bawah EMA 20
      - indicator: rsi
        operator: '>'
        value: 70.0
        description: RSI Overbought (> 70)
    Default_RSI_EMA_Volume:
      description: Strategi Sinyal Reversal Momentum & Volume
      buy_rules:
      - indicator: rsi
        operator: <
        value: 30.0
        description: RSI Oversold (< 30)
      - indicator: close
        operator: '>'
        target: ema_50
        description: Harga Close di atas EMA 50
      - indicator: volume
        operator: '>'
        target: volume_sma_20
        multiplier: 1.5
        description: Volume konfirmasi > 1.5x rata-rata 20 periode
      sell_rules:
      - indicator: rsi
        operator: '>'
        value: 70.0
        description: RSI Overbought (> 70)
      - indicator: close
        operator: cross_under
        target: ema_20
        description: Harga tembus ke bawah EMA 20
