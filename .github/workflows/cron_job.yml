name: Bot Trading Auto Cron & Market Scan

on:
  schedule:
    # Eksekusi berkala setiap jam pada server GitHub Actions
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  bot-cron-check:
    name: Scheduled Health Check & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio tzdata

      - name: Run Test Suite
        run: |
          pytest -q tests/
